name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'core/**'
      - 'CMakeLists.txt'
      - 'nipovpn/etc/nipovpn/config.yaml'
      - 'tests/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: release
            build_type: Release
            cxx_flags: ""
          - build: sanitizers
            build_type: RelWithDebInfo
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libboost-all-dev \
            libyaml-cpp-dev \
            python3-yaml \
            curl \
            openssl

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          cmake --build build -j"$(nproc)"

      - name: Run end-to-end tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: python3 tests/e2e.py --binary build/core/nipovpn --artifacts test-artifacts

      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.build }}
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 14
